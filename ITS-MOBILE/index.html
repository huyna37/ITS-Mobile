<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- Google Fonts: Be Vietnam Pro (Bộ font chuẩn quốc tế tối ưu riêng cho tiếng Việt) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;1,400;1,600&display=swap" rel="stylesheet" />
    <style>
      *, html, body, #app-root, #root {
        font-family: 'Be Vietnam Pro', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        text-rendering: optimizeLegibility;
      }
      html, body {
        height: 100%;
        margin: 0;
        padding: 0;
        background: linear-gradient(180deg, #dbeafe 0%, #f1f5f9 40%, #e2e8f0 100%);
        overflow: hidden;
      }
      *:focus, *:focus-visible {
        outline: none !important;
        box-shadow: none !important;
      }
      #app-root {
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #root {
        width: 100%;
        max-width: 440px;
        height: 100vh;
        max-height: 920px;
        background-color: #f8fafc;
        box-shadow: 0 20px 60px -10px rgba(0, 112, 184, 0.2), 0 0 0 1px rgba(0, 0, 0, 0.08);
        border-radius: 28px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        position: relative;
      }
      @media (max-width: 600px) {
        #root {
          max-width: 100%;
          height: 100%;
          max-height: 100%;
          border-radius: 0;
          box-shadow: none;
        }
      }
      @keyframes shimmerWave {
        0% {
          background-position: -200% 0;
        }
        100% {
          background-position: 200% 0;
        }
      }
      .shimmer-box {
        background: linear-gradient(90deg, #e2e8f0 0%, #ffffff 50%, #e2e8f0 100%) !important;
        background-size: 200% 100% !important;
        animation: shimmerWave 1.4s infinite ease-in-out !important;
      }
      .shimmer-box-call {
        background: linear-gradient(90deg, #e0f2fe 0%, #ffffff 50%, #e0f2fe 100%) !important;
        background-size: 200% 100% !important;
        animation: shimmerWave 1.4s infinite ease-in-out !important;
      }
      .shimmer-box-missed {
        background: linear-gradient(90deg, #fee2e2 0%, #ffffff 50%, #fee2e2 100%) !important;
        background-size: 200% 100% !important;
        animation: shimmerWave 1.4s infinite ease-in-out !important;
      }
      .shimmer-box-avatar {
        background: linear-gradient(90deg, #f1f5f9 0%, #ffffff 50%, #f1f5f9 100%) !important;
        background-size: 200% 100% !important;
        animation: shimmerWave 1.4s infinite ease-in-out !important;
      }
    </style>
  </head>
  <body>
    <div id="app-root">
      <div id="root"></div>
    </div>
    <script type="module" src="/src/index.web.tsx"></script>
  </body>
</html>
