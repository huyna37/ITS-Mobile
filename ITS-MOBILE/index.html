<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>ITS Mobile VEC — Vận Hành Cao Tốc Nội Bài - Lào Cai</title>
    <style>
      html, body {
        height: 100%;
        margin: 0;
        padding: 0;
        background: linear-gradient(180deg, #dbeafe 0%, #f1f5f9 40%, #e2e8f0 100%);
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        overflow: hidden;
      }
      *:focus, *:focus-visible {
        outline: none !important;
        box-shadow: none !important;
      }
      #app-root {
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #root {
        width: 100%;
        max-width: 440px;
        height: 100vh;
        max-height: 920px;
        background-color: #f8fafc;
        box-shadow: 0 20px 60px -10px rgba(0, 112, 184, 0.2), 0 0 0 1px rgba(0, 0, 0, 0.08);
        border-radius: 28px;
        overflow: hidden;
        display: flex;
        flex-direction: column;
        position: relative;
      }
      @media (max-width: 600px) {
        #root {
          max-width: 100%;
          height: 100%;
          max-height: 100%;
          border-radius: 0;
          box-shadow: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="app-root">
      <div id="root"></div>
    </div>
    <script type="module" src="/src/index.web.tsx"></script>
  </body>
</html>
