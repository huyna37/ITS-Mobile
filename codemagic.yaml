# Codemagic CI/CD Configuration for ITS Mobile VEC (React Native)
# Documentation: https://docs.codemagic.io/yaml/building-a-react-native-app/

workflows:
  react-native-ios:
    name: ITS Mobile - iOS
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      groups:
        - app_store_credentials # Configure in Codemagic UI: https://docs.codemagic.io/yaml-code-signing/signing-ios/
      vars:
        XCODE_WORKSPACE: "TempApp.xcworkspace"
        XCODE_SCHEME: "TempApp"
        BUNDLE_ID: "vn.etc.its.mobile"
      node: v22.13.1
      xcode: latest
      cocoapods: default
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Install npm dependencies
        script: |
          cd ITS-MOBILE
          npm install --legacy-peer-deps
      - name: Install CocoaPods
        script: |
          cd ITS-MOBILE/ios
          pod install
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles --warn-only || true
      - name: Build iOS Application
        script: |
          cd ITS-MOBILE/ios
          if [ -n "$CM_CERTIFICATE" ]; then
            xcode-project build-ipa \
              --workspace "$XCODE_WORKSPACE" \
              --scheme "$XCODE_SCHEME"
          else
            echo "Building unsigned / archive iOS release..."
            xcodebuild -workspace "$XCODE_WORKSPACE" \
              -scheme "$XCODE_SCHEME" \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              clean build
          fi
    artifacts:
      - build/ios/ipa/*.ipa
      - ITS-MOBILE/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/Products/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/Products/**/*.dSYM

  react-native-android:
    name: ITS Mobile - Android
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      groups:
        - google_credentials # Configure in Codemagic UI: https://docs.codemagic.io/yaml-publishing/google-play/
      vars:
        PACKAGE_NAME: "vn.etc.its.mobile"
      node: v22.13.1
      java: 17
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Install npm dependencies
        script: |
          cd ITS-MOBILE
          npm install --legacy-peer-deps
      - name: Set Android SDK location
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > ITS-MOBILE/android/local.properties
      - name: Build Android Release (APK & AAB)
        script: |
          cd ITS-MOBILE/android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          ./gradlew bundleRelease --no-daemon --stacktrace
    artifacts:
      - ITS-MOBILE/android/app/build/outputs/**/*.apk
      - ITS-MOBILE/android/app/build/outputs/**/*.aab
      - ITS-MOBILE/android/app/build/outputs/**/mapping.txt
