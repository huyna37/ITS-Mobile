# Codemagic CI/CD Configuration for ITS Mobile VEC (React Native)
# Documentation: https://docs.codemagic.io/yaml/building-a-react-native-app/

workflows:
  its-mobile-vec-ios:
    name: ITS Mobile VEC - iOS
    max_build_duration: 120
    instance_type: mac_mini_m2
    cache:
      cache_paths:
        - $CM_BUILD_DIR/ITS-MOBILE/node_modules
        - $HOME/Library/Caches/CocoaPods
        - $CM_BUILD_DIR/ITS-MOBILE/ios/Pods
    environment:
      groups:
        - app_store_credentials # Configure in Codemagic UI: https://docs.codemagic.io/yaml-code-signing/signing-ios/
        - telegram_credentials # Chứa TELEGRAM_BOT_TOKEN và TELEGRAM_CHAT_ID
      vars:
        XCODE_WORKSPACE: "TempApp.xcworkspace"
        XCODE_SCHEME: "TempApp"
        APP_NAME: "ITSMobileVEC"
        BUNDLE_ID: "vn.etc.its.mobile"
        TELEGRAM_BOT_TOKEN: "8526357603:AAGgWE4GdQg3TDOWxChJnzmdIb5i3-Tr-VQ"
        TELEGRAM_CHAT_ID: "-1003868007273"
      node: v22.13.1
      xcode: latest
      cocoapods: default
    triggering:
      events: [] # Đã tắt tự động khi push, chỉ trigger thủ công qua URL / API
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Prepare environment configuration
        script: |
          cd ITS-MOBILE
          if [ ! -f .env ]; then
            cp .env.example .env
          fi
      - name: Install npm dependencies
        script: |
          cd ITS-MOBILE
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps --prefer-offline
          else
            npm install --legacy-peer-deps
          fi
      - name: Install CocoaPods
        script: |
          cd ITS-MOBILE/ios
          # Dùng cache repo nếu có để tiết kiệm 1-2 phút clone specs
          pod install --repo-update=false || pod install
      - name: Set up code signing settings on Xcode project
        script: |
          xcode-project use-profiles --warn-only || true
      - name: Bundle React Native iOS JS Bundle & Assets
        script: |
          cd ITS-MOBILE
          mkdir -p ios/TempApp/assets
          echo "==> Bundling React Native for iOS..."
          npx react-native bundle \
            --platform ios \
            --dev false \
            --entry-file index.js \
            --bundle-output ios/TempApp/main.jsbundle \
            --assets-dest ios/TempApp
      - name: Build iOS Application & Package IPA
        script: |
          cd ITS-MOBILE/ios
          mkdir -p "$CM_BUILD_DIR/build/ios/ipa"

          if [ -n "$CM_CERTIFICATE" ]; then
            echo "==> Building signed IPA with Codemagic..."
            xcode-project build-ipa \
              --workspace "$XCODE_WORKSPACE" \
              --scheme "$XCODE_SCHEME"
            # Chuẩn hóa tên file IPA xuất ra
            find "$CM_BUILD_DIR/build/ios/ipa" -name "*.ipa" -exec cp {} "$CM_BUILD_DIR/build/ios/ipa/${APP_NAME}.ipa" \; 2>/dev/null || true
          else
            echo "==> Building unsigned Release (.app) with optimization flags..."
            xcodebuild -workspace "$XCODE_WORKSPACE" \
              -scheme "$XCODE_SCHEME" \
              -configuration Release \
              -destination 'generic/platform=iOS' \
              -derivedDataPath "$CM_BUILD_DIR/build/DerivedData" \
              PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
              COMPILER_INDEX_STORE_ENABLE=NO \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGN_IDENTITY="" \
              CODE_SIGNING_REQUIRED=NO \
              build

            echo "==> Packaging .app into standard .ipa..."
            APP_PATH=$(find "$CM_BUILD_DIR/build/DerivedData/Build/Products/Release-iphoneos" -name "*.app" -type d | head -n 1)
            if [ -z "$APP_PATH" ]; then
              APP_PATH=$(find "$CM_BUILD_DIR/build/DerivedData" -name "*.app" -type d | head -n 1)
            fi
            if [ -n "$APP_PATH" ] && [ -d "$APP_PATH" ]; then
              echo "Found App Bundle at: $APP_PATH"
              # Tiêm trực tiếp main.jsbundle chuẩn iOS và assets vào .app
              if [ -f "$CM_BUILD_DIR/ITS-MOBILE/ios/TempApp/main.jsbundle" ]; then
                echo "==> Injecting iOS main.jsbundle and assets into .app payload..."
                cp -f "$CM_BUILD_DIR/ITS-MOBILE/ios/TempApp/main.jsbundle" "$APP_PATH/main.jsbundle"
                cp -rf "$CM_BUILD_DIR/ITS-MOBILE/ios/TempApp/assets" "$APP_PATH/" 2>/dev/null || true
              fi
              if [ -f "$CM_BUILD_DIR/tools/app_to_ipa.py" ]; then
                python3 "$CM_BUILD_DIR/tools/app_to_ipa.py" --app "$APP_PATH" --output "$CM_BUILD_DIR/build/ios/ipa/${APP_NAME}.ipa"
              else
                PAYLOAD_DIR="/tmp/Payload"
                rm -rf "$PAYLOAD_DIR"
                mkdir -p "$PAYLOAD_DIR"
                cp -R "$APP_PATH" "$PAYLOAD_DIR/"
                cd /tmp && zip -qry "$CM_BUILD_DIR/build/ios/ipa/${APP_NAME}.ipa" Payload
              fi
            else
              echo "ERROR: Could not find .app in DerivedData!"
              exit 1
            fi
          fi
      - name: Send iOS IPA to Telegram
        script: |
          IPA_FILE="$CM_BUILD_DIR/build/ios/ipa/${APP_NAME}.ipa"
          if [ -f "$IPA_FILE" ]; then
            python3 "$CM_BUILD_DIR/tools/send_telegram.py" \
              --file "$IPA_FILE" \
              --platform "iOS" \
              --bot-token "$TELEGRAM_BOT_TOKEN" \
              --chat-id "$TELEGRAM_CHAT_ID"
          fi
    artifacts:
      - build/ios/ipa/*.ipa
      - ITS-MOBILE/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/Products/**/*.app
      - $HOME/Library/Developer/Xcode/DerivedData/**/Build/Products/**/*.dSYM

  its-mobile-vec-android:
    name: ITS Mobile VEC - Android
    max_build_duration: 120
    instance_type: linux
    cache:
      cache_paths:
        - $CM_BUILD_DIR/ITS-MOBILE/node_modules
        - $HOME/.gradle/caches
        - $HOME/.gradle/wrapper
    environment:
      groups:
        - google_credentials # Configure in Codemagic UI: https://docs.codemagic.io/yaml-publishing/google-play/
        - telegram_credentials # Chứa TELEGRAM_BOT_TOKEN và TELEGRAM_CHAT_ID
      vars:
        PACKAGE_NAME: "vn.etc.its.mobile"
        APP_NAME: "ITSMobileVEC"
        TELEGRAM_BOT_TOKEN: "8526357603:AAGgWE4GdQg3TDOWxChJnzmdIb5i3-Tr-VQ"
        TELEGRAM_CHAT_ID: "-1003868007273"
      node: v22.13.1
      java: 17
    triggering:
      events: [] # Đã tắt trigger tự động cho Android (chỉ build iOS)
      branch_patterns:
        - pattern: main
          include: true
          source: true
    scripts:
      - name: Prepare environment configuration
        script: |
          cd ITS-MOBILE
          if [ ! -f .env ]; then
            cp .env.example .env
          fi
      - name: Install npm dependencies
        script: |
          cd ITS-MOBILE
          if [ -f package-lock.json ]; then
            npm ci --legacy-peer-deps --prefer-offline
          else
            npm install --legacy-peer-deps
          fi
      - name: Set Android SDK location & Optimize Gradle
        script: |
          echo "sdk.dir=$ANDROID_SDK_ROOT" > ITS-MOBILE/android/local.properties
          mkdir -p $HOME/.gradle
          echo "org.gradle.jvmargs=-Xmx4096m -XX:+HeapDumpOnOutOfMemoryError" >> $HOME/.gradle/gradle.properties
          echo "org.gradle.parallel=true" >> $HOME/.gradle/gradle.properties
          echo "org.gradle.caching=true" >> $HOME/.gradle/gradle.properties
          echo "org.gradle.vfs.watch=false" >> $HOME/.gradle/gradle.properties
      - name: Build Android Release (APK & AAB)
        script: |
          set -e
          cd ITS-MOBILE/android
          chmod +x gradlew
          # Chạy gộp song song assembleRelease và bundleRelease để tái sử dụng build graph
          ./gradlew assembleRelease bundleRelease --no-daemon --parallel --stacktrace

          # Chuẩn hóa tên file artifact ra thư mục build/android
          mkdir -p "$CM_BUILD_DIR/build/android"
          find app/build/outputs/apk/release -name "*.apk" -exec cp {} "$CM_BUILD_DIR/build/android/${APP_NAME}-release.apk" \;
          find app/build/outputs/bundle/release -name "*.aab" -exec cp {} "$CM_BUILD_DIR/build/android/${APP_NAME}-release.aab" \;
      - name: Send Android APK to Telegram
        script: |
          APK_FILE="$CM_BUILD_DIR/build/android/${APP_NAME}-release.apk"
          if [ -f "$APK_FILE" ]; then
            python3 "$CM_BUILD_DIR/tools/send_telegram.py" \
              --file "$APK_FILE" \
              --platform "Android" \
              --bot-token "$TELEGRAM_BOT_TOKEN" \
              --chat-id "$TELEGRAM_CHAT_ID"
          else
            echo "ERROR: File APK không tồn tại tại $APK_FILE"
            exit 1
          fi
    artifacts:
      - build/android/*.apk
      - build/android/*.aab
      - ITS-MOBILE/android/app/build/outputs/**/*.apk
      - ITS-MOBILE/android/app/build/outputs/**/*.aab
      - ITS-MOBILE/android/app/build/outputs/**/mapping.txt
